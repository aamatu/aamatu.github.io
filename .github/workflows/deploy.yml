# -----------------------------------------------------------------------------
#  Builds the site with Hugo and publishes it to GitHub Pages.
#
#  Runs on every push to `main`, and can also be started by hand from the
#  Actions tab ("Run workflow").
#
#  ONE-TIME SETUP, on GitHub, before the first run:
#     Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#  Without that, this workflow builds successfully and publishes nothing.
# -----------------------------------------------------------------------------
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write only the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race. A push during a build cancels nothing that
# has already started publishing, it just queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pinned on purpose: the site should not change because Hugo did.
      # To upgrade, bump this, run the same version locally, check the diff.
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0          # gives Hugo real git dates for .Lastmod

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          TZ: Europe/Rome
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --printPathWarnings

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
