<!DOCTYPE html>
{{ $style := .Site.Params.style | default "classic" }}
<html lang="{{ .Site.Language.Locale | default .Site.Language.Lang }}" data-theme="{{ if eq $style "modern" }}dark{{ else }}light{{ end }}">
{{ partial "head.html" . }}
<body>
  <a class="skip-link" href="#main">{{ i18n "skip_link" }}</a>

  {{ partial "header.html" . }}

  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
