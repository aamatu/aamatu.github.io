{{ define "main" }}
<article>
    <h1 class="text-4xl font-bold mb-8 text-blue-400">{{ .Title }}</h1>

    {{ if .Content }}
    <div class="prose prose-invert mb-12">
        {{ .Content }}
    </div>
    {{ end }}

    {{ if .Pages }}
    <div class="space-y-6">
        {{ range .Pages }}
        <div class="border border-slate-700 rounded-lg p-6 hover:border-blue-400 hover:bg-slate-800 transition">
            <a href="{{ .Permalink }}" class="group">
                <h2 class="text-2xl font-bold text-blue-400 group-hover:text-blue-300 mb-2">{{ .Title }}</h2>
            </a>
            <p class="text-slate-400 text-sm mb-3">
                {{ .Date.Format "2 gennaio 2006" }}
            </p>
            <p class="text-slate-300">{{ .Summary }}</p>
            <a href="{{ .Permalink }}" class="inline-block mt-4 text-blue-400 hover:text-blue-300">Leggi di più →</a>
        </div>
        {{ end }}
    </div>
    {{ end }}
</article>
{{ end }}
