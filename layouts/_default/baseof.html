<!DOCTYPE html>
<html lang="{{ .Language | default "it" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ .Description | default .Summary }}">
    <meta name="author" content="{{ .Site.Params.author }}">

    <!-- SEO -->
    <meta name="keywords" content="{{ delimit .Keywords ", " }}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ .Permalink }}">

    <!-- Open Graph -->
    <meta property="og:title" content="{{ .Title }} | {{ .Site.Title }}">
    <meta property="og:description" content="{{ .Description | default .Summary }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ .Permalink }}">

    <title>{{ .Title }} | {{ .Site.Title }}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            color-scheme: dark;
        }
        body {
            background-color: #0f172a;
            color: #e2e8f0;
        }
        a {
            color: #60a5fa;
            text-decoration: none;
        }
        a:hover {
            color: #93c5fd;
        }
        code {
            background-color: #1e293b;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        pre {
            background-color: #1e293b;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1rem 0;
        }
        pre code {
            padding: 0;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100">
    <!-- Navigation -->
    <nav class="bg-slate-800 border-b border-slate-700">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-blue-400 hover:text-blue-300">Dr. Aamatu</a>
            <div class="flex gap-6">
                {{ range .Site.Menus.main }}
                <a href="{{ .URL }}" class="hover:text-blue-300 transition">{{ .Name }}</a>
                {{ end }}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-12">
        {{ block "main" . }}{{ end }}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 mt-16">
        <div class="max-w-4xl mx-auto px-4 py-8 text-center text-slate-400 text-sm">
            <p>&copy; {{ now.Year }} Dr. Aamatu. Tutti i diritti riservati.</p>
            <p class="mt-2">Sito realizzato con <a href="https://gohugo.io" class="text-blue-400">Hugo</a></p>
        </div>
    </footer>
</body>
</html>
