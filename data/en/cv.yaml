- key: current
  heading: Current positions
  items:
  - key: mtb
    when: 2023 – present
    role: Head of the Molecular Tumor Board
    org: Department of Oncology and Haematology, Grande Ospedale Metropolitano Niguarda, Milan
    note: Coordination and leadership of the Molecular Tumor Board of the Medical Oncology Division, part of the regional network.
  - key: alta
    when: 2022 – present
    role: High Specialisation for Clinical Trials and Molecular Oncology
    org: Grande Ospedale Metropolitano Niguarda, Milan
    note: Leadership and clinical co-management of clinical trials, in particular phase 1 and 2 studies in molecular clinical oncology; design, planning and implementation of trials under ICH-GCP.
  - key: oncologist
    when: 2011 – present
    role: Medical Oncologist
    org: Department of Oncology and Haematology, Grande Ospedale Metropolitano Niguarda, Milan
    note: Ward and outpatient activity, with a focus on colorectal and gastrointestinal cancers (pancreas, biliary tract, stomach); multidisciplinary colorectal and anal cancer clinic.
  - key: pi
    when: 2011 – present
    role: Principal investigator / sub-investigator, phase 1/2/3 clinical trials
    org: Phase I Unit, Niguarda Cancer Center, Milan
    note: Sponsored phase 2 and 3 trials and non-profit phase 2 and pilot studies; phase 1 studies conducted under the Italian AIFA 809/2015 framework. Phase 1 work since 2016.
